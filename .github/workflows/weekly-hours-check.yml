name: Check weekly business hours
on:
  workflow_dispatch:
    inputs:
      sid:
        description: "Existing saved-place Naver SID to check"
        required: false
        default: "1053133212"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Query one place with bounded rate-limit handling
        env:
          TARGET_SID: ${{ inputs.sid }}
        run: python3 scripts/weekly_hours_check.py

      - name: Store source-check checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-hours-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: weekly-hours-checkpoint.json
          if-no-files-found: ignore
          retention-days: 7
