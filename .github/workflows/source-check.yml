name: Check opening-hours source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check one public place page
        run: |
          python3 - <<'PY'
          import urllib.request, re, json
          url = 'https://pcmap.place.naver.com/restaurant/1501340733/home'
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  html = response.read(2000000).decode('utf-8', 'replace')
                  print('HTTP:', response.status)
                  print('Structured opening hours marker:', bool(re.search(r'openingHoursSpecification|businessHoursDetail', html, re.I)))
                  print('Page bytes:', len(html.encode()))
          except Exception as e:
              print('Source check failed:', type(e).__name__, str(e)[:200])
              raise SystemExit(1)
          PY
