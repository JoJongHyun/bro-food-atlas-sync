name: BRO CINEMA Android Focus APK
on:
  push:
    branches:
      - bro-cinema-standalone
    paths:
      - 'cinema-android/**'
      - '.github/workflows/bro-cinema-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platforms using runner SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          SDK_MANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "${SDK_MANAGER}" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build experimental APK
        working-directory: cinema-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: bro-cinema-focus-apk
          path: cinema-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
